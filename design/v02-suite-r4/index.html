<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>意客AI · R4 增量设计评审</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#172b4d;font:14px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}header{padding:20px 28px 16px;background:#fff;border-bottom:1px solid #e8edf3}h1{font-size:22px;margin:0 0 5px}p{margin:5px 0;color:#52637a}a{color:#0958d9}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px 28px 12px}button,select{font:inherit;color:inherit;background:white;border:1px solid #cbd5e1;border-radius:6px;padding:7px 12px;cursor:pointer}button[aria-current=true]{background:#e6f4ff;border-color:#1677ff;color:#0958d9}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #1677ff;outline-offset:3px}.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:0 28px 10px}.toolbar strong{font-size:17px;margin-right:auto}#note{padding:0 28px;margin-bottom:16px}.panels{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:0 28px 24px}.panels.compare{grid-template-columns:repeat(2,minmax(0,1fr))}figure{margin:0;background:white;border:1px solid #e8edf3;min-width:0}figure[hidden]{display:none}figcaption{padding:9px 12px;border-bottom:1px solid #e8edf3;font-weight:600}.frame{overflow:auto}.frame img{width:100%;height:auto;display:block}.actual-size .frame img{width:auto;max-width:none}#error{padding:12px 28px;color:#a61d24}footer{padding:0 28px 28px;color:#52637a}@media(max-width:1000px){.panels.compare{grid-template-columns:1fr}header,nav,.toolbar,#note,footer{padding-left:16px;padding-right:16px}.panels{padding:0 16px 20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<header>
<h1>意客AI · R4 增量设计评审</h1>
<p>范围已确认 · 六组视觉待确认。保留现有八个入口，在已有流程内增加判断依据、预算与结果解释。</p>
<p>这是设计图册，图片内的产品控件不执行业务操作。示例配置、状态示意与公开研究样例均不代表真实客户结果。</p>
<p><a href="README.md">范围与交接</a> · <a href="INTERACTION_CONTRACT.md">交互与数据约定</a> · <a href="VISUAL_REVIEW.md">检查与落地校正规则</a> · <a href="../../docs/qa/ui-final-acceptance/index.html">R3 实现对照</a></p>
</header>
<nav aria-label="增量页面"></nav>
<div class="toolbar">
<strong id="title"></strong>
<label>对照 <select id="mode"><option value="design">仅看 R4 设计</option><option value="compare">R3 实现 / R4 设计</option></select></label>
<label>缩放 <select id="scale"><option value="fit">适应窗口</option><option value="actual">原始尺寸</option></select></label>
<button id="prev" type="button">上一组</button><button id="next" type="button">下一组</button>
<a id="original" target="_blank" rel="noopener">打开设计原图</a>
</div>
<p id="note" role="status" aria-live="polite"></p>
<p id="error" role="alert" hidden>图片加载失败，请重新打开图册或检查本地服务。</p>
<main class="panels">
<figure id="reference-figure" hidden><figcaption>R3 真实实现截图 · 隔离 TEST</figcaption><div class="frame"><img id="reference" alt=""></div></figure>
<figure><figcaption>R4 增量设计 · 视觉待确认</figcaption><div class="frame"><img id="design" alt=""></div></figure>
</main>
<footer>按页面确认或指出修改位置。图片中的生成文字、轻微渐变与图标近似不覆盖既有组件规范；实现时使用仓库原始平台 Logo、真实字体和状态逻辑。← / → 可切换页面。</footer>
<script>
'use strict';
const pages=[
 {id:'P12',file:'R4-01-P12.png',title:'短句教练',note:'原文、短句与检查依据同屏；评论和私信分开，人工修改受保护。此帧为只读公开样例。'},
 {id:'P09',file:'R4-02-P09.png',title:'搜索覆盖与结果解释',note:'分别说明访问失败、预算耗尽、全部排除及已查范围无合格机会，支持部分完成；未知数量不记为零。'},
 {id:'P06',file:'R4-03-P06.png',title:'任务策略与预算',note:'AI 建议可编辑，需求类型可选；来源、时长和调用上限共同限制研究，P19 再确认。30 / 10 / 20 仅为配置示例。'},
 {id:'P10',file:'R4-04-P10.png',title:'机会与观察',note:'明确需求与业务变化分开复核，原文与未知项可直接查看；公开样例不能转入客户商机。'},
 {id:'P11',file:'R4-05-P11.png',title:'证据、时间线与多找类似',note:'同一来源保存版本与变化依据；多找类似先生成可编辑范围与预算预览，再创建草稿。公开样例仅预览。'},
 {id:'P02',file:'R4-06-P02.png',title:'工作台机会简报',note:'今日值得联系、重要变化、待跟进各有入口；本帧展示尚未完成检查的新空间，不伪造业绩。'}
];
const nav=document.querySelector('nav'),panels=document.querySelector('main');
for(const p of pages){const b=document.createElement('button');b.type='button';b.dataset.id=p.id;b.textContent=p.id+' · '+p.title;b.onclick=()=>location.hash=p.id;nav.append(b)}
const currentIndex=()=>Math.max(0,pages.findIndex(p=>p.id===location.hash.slice(1)));
function show(){const i=currentIndex(),p=pages[i];document.querySelector('#title').textContent=p.id+' · '+p.title;document.querySelector('#note').textContent=p.note;document.querySelector('#error').hidden=true;for(const b of nav.children)b.setAttribute('aria-current',String(b.dataset.id===p.id));const ref=document.querySelector('#reference'),design=document.querySelector('#design');ref.src='../../docs/qa/ui-final-acceptance/screens/'+p.id+'.png';ref.alt=p.id+' R3 实际实现';design.src='screens/'+p.file;design.alt=p.id+' '+p.title+' R4 设计';document.querySelector('#original').href=design.getAttribute('src');document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===pages.length-1}
function move(delta){const target=pages[currentIndex()+delta];if(target)location.hash=target.id}
document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);
document.querySelector('#mode').onchange=e=>{const compare=e.target.value==='compare';panels.classList.toggle('compare',compare);document.querySelector('#reference-figure').hidden=!compare};
document.querySelector('#scale').onchange=e=>panels.classList.toggle('actual-size',e.target.value==='actual');
for(const img of document.querySelectorAll('img'))img.onerror=()=>{document.querySelector('#error').hidden=false};
window.addEventListener('hashchange',show);
window.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}});
show();
</script>
</html>
