[project]
name = "yike-discovery-mvp"
version = "0.1.0"
description = "Local-only authorized dual-platform discovery MVP"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyNaCl==1.6.2",
    "alibabacloud-dysmsapi20170525==4.6.0",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "idna==3.18",
    "jinja2==3.1.6",
    "psycopg[binary]==3.2.10",
    "pydantic==2.11.7",
    "python-multipart==0.0.20",
    "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
research = ["mcp==1.28.0"]

[project.scripts]
yike-web = "app.cli:web"
yike-collector = "app.cli:collector"
yike-pilot-web = "pilot.cli:web"
yike-pilot-migrate = "pilot.cli:migrate"
yike-pilot-import = "pilot.cli:import_bundle"
yike-pilot-provision = "pilot.cli:provision"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pilot", "connectors"]

[tool.hatch.build.targets.wheel.force-include]
"skills/ai-project-lead-research-v1/SKILL.md" = "pilot/_assessment_rules/SKILL.md"
"skills/ai-project-lead-research-v1/references/qualification-and-evidence.md" = "pilot/_assessment_rules/references/qualification-and-evidence.md"
# A directory source stays distinct from the two assessment file sources.
# Duplicate file sources with /./ normalize to one key in Hatch, dropping one target.
"skills/ai-project-lead-research-v1" = "pilot/_research_rules"
