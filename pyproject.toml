[project]
name = "yike-discovery-mvp"
version = "0.1.0"
description = "Local-only authorized dual-platform discovery MVP"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "psycopg[binary]==3.2.10",
    "pydantic==2.11.7",
    "python-multipart==0.0.20",
    "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
yike-web = "app.cli:web"
yike-collector = "app.cli:collector"
yike-pilot-web = "pilot.cli:web"
yike-pilot-migrate = "pilot.cli:migrate"
yike-pilot-import = "pilot.cli:import_bundle"
yike-pilot-provision = "pilot.cli:provision"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pilot", "connectors"]
